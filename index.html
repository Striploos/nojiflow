<!DOCTYPE html>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Configuration Tailwind personnalisée pour les palettes Clair (Beige/Blanc) et Sombre (Noir/Violet) -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'monospace'],
          },
          colors: {
            light: {
              bg: '#FAF8F5',
              card: '#FFFFFF',
              subtle: '#F3EFEA',
              border: '#E6E0D8',
              text: '#1C1B18',
              muted: '#6E6960',
              accent: '#262420',
              accentHover: '#3D3A34',
            },
            dark: {
              bg: '#0E0E12',
              card: '#17171E',
              subtle: '#1F1F29',
              border: '#2A2A36',
              text: '#F3F3F7',
              muted: '#9494A8',
              accent: '#8B5CF6',
              accentHover: '#7C3AED',
              accentSoft: '#A78BFA',
            }
          },
          boxShadow: {
            'soft': '0 2px 10px -2px rgba(28, 27, 24, 0.05), 0 1px 3px -1px rgba(28, 27, 24, 0.03)',
            'card': '0 10px 30px -10px rgba(28, 27, 24, 0.08), 0 2px 8px -2px rgba(28, 27, 24, 0.04)',
            'card-dark': '0 14px 36px -10px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(139, 92, 246, 0.08)',
          }
        }
      }
    };
  </script>

  <!-- Styles dédiés aux animations 3D de retournement de carte et transitions fluides -->
  <style>
    /* Retournement de carte 3D adaptatif (sans hauteur fixe grâce à CSS Grid) */
    .perspective-1200 {
      perspective: 1200px;
    }
    .flip-card-inner {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      transform-style: preserve-3d;
      transition: transform 0.52s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .flip-card-inner.is-flipped {
      transform: rotateY(180deg);
    }
    .flip-card-face {
      grid-column: 1 / 1;
      grid-row: 1 / 1;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .flip-card-back {
      transform: rotateY(180deg);
    }

    /* Animations douces d'apparition */
    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.99);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .animate-fade-slide {
      animation: fadeSlideUp 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .animate-toast {
      animation: toastIn 0.25s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Personnalisation discrète de la barre de défilement */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(130, 125, 118, 0.28);
      border-radius: 9999px;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: rgba(139, 92, 246, 0.28);
    }
  </style>

  <!-- Initialisation immédiate du thème selon la préférence système (évite tout flash visuel) -->
  <script>
    (function () {
      try {
        const savedTheme = window.localStorage ? window.localStorage.getItem('nojiflow_theme') : null;
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {
        // Ignorer si l'accès au stockage local est restreint
      }
    })();
  </script>
</head>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import {
      getAuth,
      signInAnonymously,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signInWithPopup,
      GoogleAuthProvider,
      sendPasswordResetEmail,
      signOut,
      onAuthStateChanged,
      updateProfile,
    } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      deleteDoc,
      onSnapshot,
      collection,
      writeBatch,
    } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    /* =====================================================================
       1. CONSTANTES, CONFIGURATION FIREBASE ET ÉTAT GLOBAL
    ===================================================================== */
    const LEGACY_STORAGE_KEY = 'nojiflow_srs_data_v1';
    const THEME_KEY = 'nojiflow_theme';
    const MIN_MS = 60 * 1000;
    const HOUR_MS = 60 * MIN_MS;
    const DAY_MS = 24 * HOUR_MS;

    const appId = 'nojiflow-prod';

    const firebaseConfig = {
      apiKey: 'AIzaSyA021s28z0HaMobCjwItbD8pVBVzLbTk4Y',
      authDomain: 'nojiflow-1926e.firebaseapp.com',
      databaseURL: 'https://nojiflow-1926e-default-rtdb.europe-west1.firebasedatabase.app',
      projectId: 'nojiflow-1926e',
      storageBucket: 'nojiflow-1926e.firebasestorage.app',
      messagingSenderId: '623513434596',
      appId: '1:623513434596:web:c27c1b776c6f2fcd9a6ff1',
      measurementId: 'G-2CNDJQ0KNP',
    };

    /** État de la couche Cloud (Firebase Auth + Firestore) */
    const cloud = {
      available: false,
      app: null,
      auth: null,
      db: null,
      user: null,
      syncStatus: 'local', // 'synced' | 'syncing' | 'local' | 'error'
      unsubProfile: null,
      unsubDecks: null,
      initialDecksLoaded: false,
      migrationPromptedForUid: null,
      dropdownOpen: false,
    };

    /** État global de l'application */
    const appState = {
      data: {
        decks: [],
        stats: { reviewedToday: 0, lastReviewDate: null, streak: 0 },
      },
      // Mémoire tampon locale (mode invité + détection de paquets à migrer vers le cloud)
      guestBackupDecks: [],
      pendingMigrationDecks: [],
      view: 'dashboard', // 'dashboard' | 'manage' | 'study'
      activeDeckId: null,
      manageSearch: '',
      manageFilter: 'all', // 'all' | 'new' | 'learning' | 'due' | 'mastered'
      study: null,
      waitingTimerId: null,
      csvImportState: null,
      ready: false,
    };

    /* =====================================================================
       2. UTILITAIRES GÉNÉRAUX (DATES, TEXTE, FORMATAGE, PRESSE-PAPIERS)
    ===================================================================== */

    /** Génère un identifiant unique lisible */
    function generateId(prefix = 'id') {
      return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
    }

    /** Retourne la date locale au format YYYY-MM-DD */
    function getLocalDateKey(date = new Date()) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    /** Retourne le timestamp du début de journée locale (00:00:00) */
    function getStartOfLocalDay(timestamp = Date.now()) {
      const d = new Date(timestamp);
      d.setHours(0, 0, 0, 0);
      return d.getTime();
    }

    /** Retourne le timestamp de fin de journée locale (23:59:59.999) */
    function getEndOfLocalDay(timestamp = Date.now()) {
      const d = new Date(timestamp);
      d.setHours(23, 59, 59, 999);
      return d.getTime();
    }

    /** Échappe le HTML pour prévenir toute injection XSS */
   function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      const map = { '&': 'amp', '<': 'lt', '>': 'gt', '"': 'quot', "'": '#39' };
      return String(str).replace(/[&<>"']/g, (c) => '&' + map[c] + ';');
    }

    /** Copie un texte dans le presse-papiers compatible iFrame */
    function copyTextToClipboard(text) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        return true;
      } catch (err) {
        console.error('Échec copie presse-papiers :', err);
        return false;
      }
    }

    /** Retourne le thème actif ('dark' ou 'light') */
    function getCurrentTheme() {
      return document.documentElement.classList.contains('dark') ? 'dark' : 'light';
    }

    /** Applique un thème ('dark' | 'light') */
    function applyTheme(theme) {
      const isDark = theme === 'dark';
      document.documentElement.classList.toggle('dark', isDark);
      try {
        if (window.localStorage) {
          window.localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
        }
      } catch (e) {
        // Ignorer si restreint
      }
    }

    /**
     * Formate le contenu d'une flashcard :
     * - Échappe le HTML
     * - Met en forme le code inline entre backticks (`code`)
     * - Conserve les retours à la ligne
     */
    function renderCardContent(text) {
      const escaped = escapeHtml(text || '');
      const withInlineCode = escaped.replace(
        /`([^`\n]+)`/g,
        '<code class="px-1.5 py-0.5 mx-0.5 rounded-md font-mono text-[0.88em] bg-light-subtle dark:bg-dark-subtle border border-light-border dark:border-dark-border text-rose-700 dark:text-dark-accentSoft">$1</code>'
      );
      return withInlineCode.replace(/\r?\n/g, '<br>');
    }

    /** Formate une durée (en ms) en libellé court lisible en français */
    function formatDurationMs(ms) {
      if (ms < MIN_MS) return '< 1 min';
      if (ms < HOUR_MS) {
        const mins = Math.max(1, Math.round(ms / MIN_MS));
        return `${mins} min`;
      }
      if (ms < DAY_MS) {
        const hrs = Math.max(1, Math.round(ms / HOUR_MS));
        return `${hrs} h`;
      }
      const days = Math.max(1, Math.round(ms / DAY_MS));
      if (days < 30) return `${days} j`;
      if (days < 365) {
        const months = (days / 30).toFixed(1).replace(/\.0$/, '');
        return `${months} mois`;
      }
      const years = (days / 365).toFixed(1).replace(/\.0$/, '');
      return `${years} an${Number(years) >= 2 ? 's' : ''}`;
    }

    /** Formate un intervalle en jours pour les boutons SRS */
    function formatDaysLabel(days) {
      if (days < 1) {
        return formatDurationMs(days * DAY_MS);
      }
      const rounded = Math.round(days);
      if (rounded < 30) return `${rounded} j`;
      if (rounded < 365) {
        const months = (rounded / 30).toFixed(1).replace(/\.0$/, '');
        return `${months} mois`;
      }
      const years = (rounded / 365).toFixed(1).replace(/\.0$/, '');
      return `${years} an${Number(years) >= 2 ? 's' : ''}`;
    }

    /** Formate la prochaine date de révision d'une carte pour la vue "Gérer les cartes" */
    function formatNextDueBadge(card, now = Date.now()) {
      if (card.status === 'new') {
        return { text: 'Nouvelle', tone: 'blue' };
      }
      const diff = card.due - now;
      if (diff <= 0) {
        if (card.status === 'learning' || card.status === 'relearning') {
          return { text: 'À revoir maintenant', tone: 'orange' };
        }
        return { text: 'Due aujourd’hui', tone: 'green' };
      }
      if (diff < HOUR_MS) {
        return { text: `Dans ${formatDurationMs(diff)}`, tone: 'orange' };
      }
      if (card.due <= getEndOfLocalDay(now)) {
        return { text: `Aujourd’hui (${formatDurationMs(diff)})`, tone: 'orange' };
      }
      const d = new Date(card.due);
      const dateStr = d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
      const intervalStr = card.interval >= 1 ? ` · int. ${formatDaysLabel(card.interval)}` : '';
      return { text: `${dateStr}${intervalStr}`, tone: 'neutral' };
    }

    /** Traduit les erreurs Firebase Auth en messages clairs en français */
    function formatAuthErrorFr(error) {
      const code = error?.code || '';
      const map = {
        'auth/invalid-email': 'L’adresse e-mail saisie n’est pas valide.',
        'auth/user-disabled': 'Ce compte utilisateur a été désactivé.',

    /** Vérifie le changement de jour pour réinitialiser reviewedToday et vérifier le streak */
    function normalizeDailyStats(stats) {
      if (!stats) return;
      const today = getLocalDateKey();
      if (!stats.lastReviewDate) {
        stats.reviewedToday = 0;
        stats.streak = 0;
        return;
      }
      if (stats.lastReviewDate === today) {
        return;
      }
      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      const yesterdayKey = getLocalDateKey(yesterday);

      stats.reviewedToday = 0;
      if (stats.lastReviewDate !== yesterdayKey) {
        stats.streak = 0;
      }
    }

    /** Enregistre une révision effectuée dans les statistiques quotidiennes */
    function recordReviewInStats() {
      const stats = appState.data.stats;
      const today = getLocalDateKey();
      normalizeDailyStats(stats);

      if (stats.lastReviewDate !== today) {
        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        const yesterdayKey = getLocalDateKey(yesterday);

        if (stats.lastReviewDate === yesterdayKey) {
          stats.streak = (stats.streak || 0) + 1;
        } else {
          stats.streak = 1;
        }
        stats.lastReviewDate = today;
        stats.reviewedToday = 1;
      } else {
        stats.reviewedToday = (stats.reviewedToday || 0) + 1;
      }

      updateHeaderStats();
      persistProfile();
    }

    /* =====================================================================
       4. COUCHE CLOUD FIRESTORE, SYNCHRONISATION TEMPS RÉEL & MIGRATION
    ===================================================================== */

    /** Retourne les références Firestore privées de l'utilisateur connecté */
    function getUserFirestoreRefs(uid) {
      return {
        profileDoc: doc(cloud.db, 'artifacts', appId, 'users', uid, 'profile', 'main'),
        decksCol: collection(cloud.db, 'artifacts', appId, 'users', uid, 'decks'),
        deckDoc: (deckId) => doc(cloud.db, 'artifacts', appId, 'users', uid, 'decks', deckId),
      };
    }

    /** Met à jour l'indicateur visuel d'état de synchronisation dans l'en-tête */
    function setSyncStatus(status) {
      cloud.syncStatus = status;
      updateHeaderAccountUI();
    }

    /** Détache proprement tous les écouteurs Firestore en temps réel */
    function unsubscribeCloudListeners() {
      if (typeof cloud.unsubProfile === 'function') {
        cloud.unsubProfile();
        cloud.unsubProfile = null;
      }
      if (typeof cloud.unsubDecks === 'function') {
        cloud.unsubDecks();
        cloud.unsubDecks = null;
      }
      cloud.initialDecksLoaded = false;
    }

    /** Sauvegarde un paquet dans Firestore (si connecté) ou conserve en mémoire locale */
    async function persistDeck(deck) {
      deck.updatedAt = Date.now();

      if (!cloud.db || !cloud.user) {
        syncGuestBackupFromState();
        return;
      }

      try {
        setSyncStatus('syncing');
        const { deckDoc } = getUserFirestoreRefs(cloud.user.uid);
        await setDoc(deckDoc(deck.id), {
          id: deck.id,
          name: deck.name,
          createdAt: deck.createdAt || Date.now(),
          updatedAt: deck.updatedAt,
          cards: Array.isArray(deck.cards) ? deck.cards : [],
        });
        setSyncStatus('synced');
      } catch (err) {
        console.error('Erreur sauvegarde paquet Firestore :', err);
        setSyncStatus('error');
        showToast('Erreur de synchronisation du paquet.', 'error');
      }
    }

    /** Supprime un paquet de Firestore (si connecté) */
    async function removeDeckPersistence(deckId) {
      if (!cloud.db || !cloud.user) {
        syncGuestBackupFromState();
        return;
      }

      try {
        setSyncStatus('syncing');
        const { deckDoc } = getUserFirestoreRefs(cloud.user.uid);
        await deleteDoc(deckDoc(deckId));
        setSyncStatus('synced');
      } catch (err) {
        console.error('Erreur suppression paquet Firestore :', err);
        setSyncStatus('error');
        showToast('Erreur lors de la suppression sur le cloud.', 'error');
      }
    }

    /** Sauvegarde le profil (stats SRS quotidiennes & thème) dans Firestore */
    async function persistProfile() {
      if (!cloud.db || !cloud.user) return;

      try {
        setSyncStatus('syncing');
        const { profileDoc } = getUserFirestoreRefs(cloud.user.uid);
        await setDoc(
          profileDoc,
          {
            stats: appState.data.stats,
            theme: getCurrentTheme(),
            initialized: true,
            updatedAt: Date.now(),
          },
          { merge: true }
        );
        setSyncStatus('synced');
      } catch (err) {
        console.error('Erreur sauvegarde profil Firestore :', err);
        setSyncStatus('error');
      }
    }

    /** Conserve une copie des paquets créés en mode local afin de proposer leur migration */
    function syncGuestBackupFromState() {
      appState.guestBackupDecks = appState.data.decks.map((d) => ({
        ...d,
        cards: (d.cards || []).map((c) => ({ ...c })),
      }));
    }

    /** Lit d'éventuels anciens paquets locaux (localStorage hérité + session invitée) */
    function collectLocalDecksForMigration() {
      const collected = [];
      const seenIds = new Set();

      for (const d of appState.guestBackupDecks || []) {
        if (d && d.name && !seenIds.has(d.id)) {
          seenIds.add(d.id);
          collected.push(d);
        }
      }

      try {
        const raw = window.localStorage ? window.localStorage.getItem(LEGACY_STORAGE_KEY) : null;
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.decks)) {
            for (const d of parsed.decks) {
              if (d && d.name && !seenIds.has(d.id)) {
                seenIds.add(d.id);
                collected.push(d);
              }
            }
          }
        }
      } catch (err) {
        console.warn('Impossible de lire les anciennes données locales :', err);
      }

      const meaningful = collected.filter((d) => {
        if (d.id !== 'deck_demo_srs') return true;
        const hasProgress = (d.cards || []).some((c) => c.status && c.status !== 'new');
        const hasExtraCards = (d.cards || []).length !== 4;
        return hasProgress || hasExtraCards;
      });

      return meaningful;
    }

    /** Efface les tampons locaux après migration confirmée ou ignorée */
    function clearLocalMigrationBuffer() {
      appState.guestBackupDecks = [];
      appState.pendingMigrationDecks = [];
      try {
        if (window.localStorage) {
          window.localStorage.removeItem(LEGACY_STORAGE_KEY);
        }
      } catch (e) {
        // Ignorer
      }
      renderMigrationBanner();
    }

    /** Importe en un clic les paquets locaux vers le compte Cloud Firestore */
    async function migrateLocalDecksToCloud() {
      if (!cloud.db || !cloud.user) return;
      const toMigrate = appState.pendingMigrationDecks || [];
      if (toMigrate.length === 0) return;

      try {
        setSyncStatus('syncing');
        const { deckDoc } = getUserFirestoreRefs(cloud.user.uid);
        const existingIds = new Set(appState.data.decks.map((d) => d.id));
        const batch = writeBatch(cloud.db);
        let importedCount = 0;

        for (const deck of toMigrate) {
          const newId = existingIds.has(deck.id) ? generateId('deck') : deck.id;
          batch.set(deckDoc(newId), {
            id: newId,
            name: deck.name,
            createdAt: deck.createdAt || Date.now(),
            updatedAt: Date.now(),
            cards: Array.isArray(deck.cards) ? deck.cards : [],
          });
          importedCount++;
        }

        await batch.commit();
        clearLocalMigrationBuffer();
        setSyncStatus('synced');
        showToast(
          `${importedCount} paquet${importedCount > 1 ? 's' : ''} local${importedCount > 1 ? 'aux' : ''} importé${importedCount > 1 ? 's' : ''} vers votre compte cloud !`,
          'success'
        );
      } catch (err) {
        console.error('Erreur migration paquets locaux :', err);
        setSyncStatus('error');
        showToast('Impossible d’importer les paquets locaux.', 'error');
      }
    }

    /** Connecte les écouteurs Firestore temps réel après authentification d'un utilisateur */
    async function handleUserSignedIn(user) {
      unsubscribeCloudListeners();
      cloud.user = user;
      setSyncStatus('syncing');

      const { profileDoc, decksCol, deckDoc } = getUserFirestoreRefs(user.uid);

      try {
        const profileSnap = await getDoc(profileDoc);
        if (!profileSnap.exists()) {
          const initialStats = { reviewedToday: 0, lastReviewDate: null, streak: 0 };
          await setDoc(profileDoc, {
            stats: initialStats,
            theme: getCurrentTheme(),
            initialized: true,
            createdAt: Date.now(),
            updatedAt: Date.now(),
          });
          const demo = createDemoDeck();
          await setDoc(deckDoc(demo.id), demo);
        }

        cloud.unsubProfile = onSnapshot(
          profileDoc,
          (snap) => {
            if (snap.exists()) {
              const data = snap.data();
              if (data.stats) {
                appState.data.stats = {
                  reviewedToday: data.stats.reviewedToday || 0,
                  lastReviewDate: data.stats.lastReviewDate || null,
                  streak: data.stats.streak || 0,
                };
                normalizeDailyStats(appState.data.stats);
                updateHeaderStats();
              }
              if (data.theme === 'dark' || data.theme === 'light') {
                if (getCurrentTheme() !== data.theme) {
                  applyTheme(data.theme);
                }
              }
            }
          },
          (err) => {
            console.error('Erreur listener profil Firestore :', err);
            setSyncStatus('error');
          }
        );

        cloud.unsubDecks = onSnapshot(
          decksCol,
          (snapshot) => {
            const loadedDecks = snapshot.docs.map((d) => {
              const val = d.data();
              return {
                id: val.id || d.id,
                name: val.name || 'Sans titre',
                createdAt: val.createdAt || 0,
                updatedAt: val.updatedAt || 0,
                cards: Array.isArray(val.cards) ? val.cards : [],
              };
            });

            loadedDecks.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
            appState.data.decks = loadedDecks;
            appState.ready = true;
            setSyncStatus('synced');

            if (!cloud.initialDecksLoaded) {
              cloud.initialDecksLoaded = true;
              const localDecks = collectLocalDecksForMigration();
              if (localDecks.length > 0 && cloud.migrationPromptedForUid !== user.uid) {
                cloud.migrationPromptedForUid = user.uid;
                appState.pendingMigrationDecks = localDecks;
                renderMigrationBanner();
              }
            }

            rerenderAfterRealtimeUpdate();
          },
          (err) => {
            console.error('Erreur listener paquets Firestore :', err);
            setSyncStatus('error');
            showToast('Impossible de synchroniser vos paquets en temps réel.', 'error');
          }
        );
      } catch (err) {
        console.error('Erreur lors de la connexion au cloud :', err);
        setSyncStatus('error');
        appState.ready = true;
        renderApp();
      }
    }

    /** Passe l'application en mode invité local (hors ligne / déconnecté) */
    function handleUserSignedOut() {
      unsubscribeCloudListeners();
      cloud.user = null;
      appState.pendingMigrationDecks = [];
      renderMigrationBanner();
      setSyncStatus('local');

      const legacyDecks = collectLocalDecksForMigration();
      if (appState.guestBackupDecks.length > 0) {
        appState.data.decks = appState.guestBackupDecks.map((d) => ({
          ...d,
          cards: (d.cards || []).map((c) => ({ ...c })),
        }));
      } else if (legacyDecks.length > 0) {
        appState.data.decks = legacyDecks;
        syncGuestBackupFromState();
      } else {
        appState.data.decks = [createDemoDeck()];
      }

      appState.data.stats = { reviewedToday: 0, lastReviewDate: null, streak: 0 };
      appState.view = 'dashboard';
      appState.study = null;
      appState.ready = true;
      renderApp();
    }

    /** Met à jour la vue après réception d'une mise à jour Firestore temps réel */
    function rerenderAfterRealtimeUpdate() {
      const activeEl = document.activeElement;
      const isSearching = activeEl && activeEl.id === 'manage-search-input';
      if (isSearching) {
        const pos = activeEl.selectionStart;
        renderApp();
        const nextInput = document.getElementById('manage-search-input');
        if (nextInput) {
          nextInput.focus();
          nextInput.setSelectionRange(pos, pos);
        }
        return;
      }

      if (appState.view === 'study' && appState.study && !appState.study.completed) {
        const deck = getDeckById(appState.study.deckId);
        if (!deck) {
          exitStudySession();
          return;
        }
        if (appState.study.currentCardId) {
          const exists = deck.cards.some((c) => c.id === appState.study.currentCardId);
          if (exists) {
            updateHeaderStats();
            return;
          }
        }
      }

      renderApp();
    }

    /** Initialise Firebase et lance la séquence d'authentification */
    /** Initialise Firebase et lance la séquence d'authentification */
    async function initFirebaseAndAuth() {
      try {
        cloud.app = initializeApp(firebaseConfig);
        cloud.auth = getAuth(cloud.app);
        cloud.db = getFirestore(cloud.app);
        cloud.available = true;

        // Écoute les changements de compte (session persistée, connexion, inscription, déconnexion)
        onAuthStateChanged(cloud.auth, async (user) => {
          if (user) {
            await handleUserSignedIn(user);
          } else {
            handleUserSignedOut();
          }
        });
      } catch (err) {
        console.error('Erreur initialisation Firebase :', err);
        cloud.available = false;
        handleUserSignedOut();
      }
    }

    /* =====================================================================
       6. ALGORITHME DE RÉPÉTITION ESPACÉE (SRS TYPE NOJI / SM-2)
    ===================================================================== */

    function simulateSRS(card, rating, now = Date.now()) {
      const startToday = getStartOfLocalDay(now);
      const currentEase = card.ease || 2.5;
      const status = card.status || 'new';
      const step = card.step || 0;
      const reps = card.reps || 0;
      const lapses = card.lapses || 0;
      const interval = card.interval || 0;

      // 1. CARTE NOUVELLE
      if (status === 'new') {
        if (rating === 'again') {
          return {
            status: 'learning',
            step: 0,
            interval: 0,
            ease: currentEase,
            reps: 0,
            lapses,
            due: now + 1 * MIN_MS,
            label: '1 min',
          };
        }
        if (rating === 'hard') {
          return {
            status: 'learning',
            step: 0,
            interval: 0,
            ease: Math.max(1.3, Number((currentEase - 0.1).toFixed(2))),
            reps: 0,
            lapses,
            due: now + 6 * MIN_MS,
            label: '6 min',
          };
        }
        if (rating === 'good') {
          return {
            status: 'learning',
            step: 1,
            interval: 0,
            ease: currentEase,
            reps: 0,
            lapses,
            due: now + 10 * MIN_MS,
            label: '10 min',
          };
        }
        return {
          status: 'review',
          step: 0,
          interval: 4,
          ease: Number((currentEase + 0.15).toFixed(2)),
          reps: 1,
          lapses,
          due: startToday + 4 * DAY_MS,
          label: '4 j',
        };
      }

      // 2. CARTE EN COURS D'APPRENTISSAGE OU DE RÉAPPRENTISSAGE
      if (status === 'learning' || status === 'relearning') {
        if (rating === 'again') {
          return {
            status,
            step: 0,
            interval: status === 'relearning' ? Math.max(1, interval) : 0,
            ease: currentEase,
            reps,
            lapses,
            due: now + 1 * MIN_MS,
            label: '1 min',
          };
        }
        if (rating === 'hard') {
          const delayMins = step === 0 ? 6 : 10;
          return {
            status,
            step,
            interval,
            ease: currentEase,
            reps,
            lapses,
            due: now + delayMins * MIN_MS,
            label: `${delayMins} min`,
          };
        }
        if (rating === 'good') {
          if (step === 0) {
            return {
              status,
              step: 1,
              interval,
              ease: currentEase,
              reps,
              lapses,
              due: now + 10 * MIN_MS,
              label: '10 min',
            };
          }
          const gradInterval = status === 'relearning' ? Math.max(1, Math.round(interval * 0.5)) : 1;
          return {
            status: 'review',
            step: 0,
            interval: gradInterval,
            ease: currentEase,
            reps: Math.max(1, reps),
            lapses,
            due: startToday + gradInterval * DAY_MS,
            label: formatDaysLabel(gradInterval),
          };
        }
        const easyInterval =
          status === 'relearning' ? Math.max(2, Math.round(interval * 0.75) + 1) : 4;
        return {
          status: 'review',
          step: 0,
          interval: easyInterval,
          ease: Number((currentEase + 0.15).toFixed(2)),
          reps: Math.max(1, reps),
          lapses,
          due: startToday + easyInterval * DAY_MS,
          label: formatDaysLabel(easyInterval),
        };
      }

      // 3. CARTE EN RÉVISION (SM-2)
      const baseInterval = Math.max(1, interval);

      if (rating === 'again') {
        return {
          status: 'relearning',
          step: 0,
          interval: Math.max(1, Math.round(baseInterval * 0.5)),
          ease: Math.max(1.3, Number((currentEase - 0.2).toFixed(2))),
          reps: 0,
          lapses: lapses + 1,
          due: now + 1 * MIN_MS,
          label: '1 min',
        };
      }

      if (rating === 'hard') {
        if (baseInterval === 1) {
          return {
            status: 'review',
            step: 0,
            interval: 1,
            ease: Math.max(1.3, Number((currentEase - 0.15).toFixed(2))),
            reps: reps + 1,
            lapses,
            due: now + 12 * HOUR_MS,
            label: '12 h',
          };
        }
        const hardDays = Math.max(baseInterval + 1, Math.round(baseInterval * 1.2));
        return {
          status: 'review',
          step: 0,
          interval: hardDays,
          ease: Math.max(1.3, Number((currentEase - 0.15).toFixed(2))),
          reps: reps + 1,
          lapses,
          due: startToday + hardDays * DAY_MS,
          label: formatDaysLabel(hardDays),
        };
      }

      const goodDays =
        baseInterval === 1 && reps <= 1
          ? 3
          : Math.max(baseInterval + 1, Math.round(baseInterval * currentEase));

      if (rating === 'good') {
        return {
          status: 'review',
          step: 0,
          interval: goodDays,
          ease: currentEase,
          reps: reps + 1,
          lapses,
          due: startToday + goodDays * DAY_MS,
          label: formatDaysLabel(goodDays),
        };
      }

      const newEase = Number((currentEase + 0.15).toFixed(2));
      const easyDays = Math.max(goodDays + 1, Math.round(baseInterval * currentEase * 1.3));
      return {
        status: 'review',
        step: 0,
        interval: easyDays,
        ease: newEase,
        reps: reps + 1,
        lapses,
        due: startToday + easyDays * DAY_MS,
        label: formatDaysLabel(easyDays),
      };
    }

    /** Calcule les compteurs d'un paquet (Nouvelles, En cours, À réviser, Total) */
    function getDeckCounts(deck, now = Date.now()) {
      const endToday = getEndOfLocalDay(now);
      let newCount = 0;
      let learningCount = 0;
      let reviewDueCount = 0;

      for (const card of deck.cards || []) {
        if (card.status === 'new') {
          newCount++;
        } else if (card.status === 'learning' || card.status === 'relearning') {
          learningCount++;
        } else if (card.status === 'review' && card.due <= endToday) {
          reviewDueCount++;
        }
      }

      return {
        newCount,
        learningCount,
        reviewDueCount,
        totalDue: newCount + learningCount + reviewDueCount,
        total: (deck.cards || []).length,
      };
    }

    /* =====================================================================
       7. PARSEUR & EXPORTATEUR CSV ROBUSTE (RFC 4180)
    ===================================================================== */

    function detectCsvDelimiter(text) {
      const sample = (text || '').slice(0, 4000);
      const candidates = [';', ',', '\t'];
      const scores = { ';': 0, ',': 0, '\t': 0 };
      const linesCount = { ';': 0, ',': 0, '\t': 0 };
      const seenInLine = { ';': false, ',': false, '\t': false };
      let inQuotes = false;

      for (let i = 0; i < sample.length; i++) {
        const ch = sample[i];
        if (ch === '"') {
          if (inQuotes && sample[i + 1] === '"') {
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (!inQuotes) {
          if (ch === '\n' || ch === '\r') {
            for (const c of candidates) {
              if (seenInLine[c]) linesCount[c]++;
              seenInLine[c] = false;
            }
          } else if (scores[ch] !== undefined) {
            scores[ch]++;
            seenInLine[ch] = true;
          }
        }
      }
      for (const c of candidates) {
        if (seenInLine[c]) linesCount[c]++;
      }

      let best = ',';
      let bestRank = -1;
      for (const c of candidates) {
        const rank = linesCount[c] * 1000 + scores[c];
        if (rank > bestRank && scores[c] > 0) {
          bestRank = rank;
          best = c;
        }
      }
      return best;
    }

    function parseRFC4180CSV(rawText, delimiter) {
      if (!rawText) return [];
      const text = rawText.charCodeAt(0) === 0xfeff ? rawText.slice(1) : rawText;

      const rows = [];
      let row = [];
      let field = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];

        if (inQuotes) {
          if (ch === '"') {
            if (text[i + 1] === '"') {
              field += '"';
              i++;
            } else {
              inQuotes = false;
            }
          } else {
            field += ch;
          }
        } else {
          if (ch === '"' && field.length === 0) {
            inQuotes = true;
          } else if (ch === delimiter) {
            row.push(field);
            field = '';
          } else if (ch === '\r') {
            if (text[i + 1] === '\n') i++;
            row.push(field);
            rows.push(row);
            row = [];
            field = '';
          } else if (ch === '\n') {
            row.push(field);
            rows.push(row);
            row = [];
            field = '';
          } else {
            field += ch;
          }
        }
      }

      if (field.length > 0 || row.length > 0) {
        row.push(field);
        rows.push(row);
      }

      return rows.filter((r) => r.some((cell) => cell.trim() !== ''));
    }

    function escapeCsvCell(value) {
      const str = String(value ?? '');
      if (/[",\r\n;]/.test(str)) {
        return `"${str.replace(/"/g, '""')}"`;
      }
      return str;
    }

    function exportDeckToCSV(deckId) {
      const deck = getDeckById(deckId);
      if (!deck) return;
      if (deck.cards.length === 0) {
        showToast('Ce paquet ne contient aucune carte à exporter.', 'info');
        return;
      }

      const header = 'Recto,Verso';
      const lines = deck.cards.map(
        (c) => `${escapeCsvCell(c.front)},${escapeCsvCell(c.back)}`
      );
      const csvContent = '\uFEFF' + [header, ...lines].join('\r\n');

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      const safeFilename =
        deck.name
          .toLowerCase()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-|-$/g, '') || 'paquet-flashcards';

      link.href = url;
      link.download = `${safeFilename}.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);

      showToast(`Paquet « ${deck.name} » exporté (${deck.cards.length} cartes).`, 'success');
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const styles = {
        success:
          'border-emerald-200 dark:border-emerald-500/30 bg-white dark:bg-dark-card text-light-text dark:text-dark-text',
        error:
          'border-rose-200 dark:border-rose-500/30 bg-white dark:bg-dark-card text-light-text dark:text-dark-text',
        info: 'border-light-border dark:border-dark-border bg-white dark:bg-dark-card text-light-text dark:text-dark-text',
      };
      const icons = {
        success: '<span class="w-2.5 h-2.5 rounded-full bg-emerald-500 shrink-0"></span>',
        error: '<span class="w-2.5 h-2.5 rounded-full bg-rose-500 shrink-0"></span>',
        info: '<span class="w-2.5 h-2.5 rounded-full bg-blue-500 dark:bg-dark-accentSoft shrink-0"></span>',
      };

      const toast = document.createElement('div');
      toast.className = `pointer-events-auto animate-toast flex items-center gap-2.5 px-4 py-3 rounded-xl border shadow-lg text-sm font-medium max-w-sm ${styles[type] || styles.info}`;
      toast.innerHTML = `${icons[type] || icons.info}<span>${escapeHtml(message)}</span>`;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.transition = 'opacity 0.25s ease, transform 0.25s ease';
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(8px)';
        setTimeout(() => toast.remove(), 260);
      }, 3200);
    }

    function bindCsvModalEvents() {
      const st = appState.csvImportState;
      const dropzone = document.getElementById('csv-dropzone');
      const fileInput = document.getElementById('csv-file-input');
      const pasteArea = document.getElementById('csv-paste-area');
      const targetSelect = document.getElementById('csv-target-deck');
      const newDeckWrap = document.getElementById('csv-new-deck-wrap');
      const newDeckInput = document.getElementById('csv-new-deck-name');
      const skipHeaderCb = document.getElementById('csv-skip-header');
      const swapSidesCb = document.getElementById('csv-swap-sides');
      const confirmBtn = document.getElementById('csv-confirm-import-btn');

      function handleFile(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          const content = String(ev.target.result || '');
          st.rawText = content;
          st.fileName = file.name;
          pasteArea.value = content;
          document.getElementById('csv-dropzone-label').innerHTML =
            `<span class="text-emerald-600 dark:text-emerald-400 font-semibold">${escapeHtml(file.name)}</span> chargé`;

          const baseName = file.name.replace(/\.(csv|txt)$/i, '').replace(/[_-]+/g, ' ').trim();
          if (baseName && !newDeckInput.value.trim()) {
            newDeckInput.value = baseName;
            st.newDeckName = baseName;
          }
          refreshCsvPreview();
        };
        reader.onerror = () => showToast('Impossible de lire ce fichier.', 'error');
        reader.readAsText(file, 'UTF-8');
      }

      dropzone?.addEventListener('click', () => fileInput?.click());
      fileInput?.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) handleFile(e.target.files[0]);
      });

      dropzone?.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropzone.classList.add('border-light-accent', 'dark:border-dark-accent', 'bg-light-subtle/70', 'dark:bg-dark-accent/10');
      });
      dropzone?.addEventListener('dragleave', () => {
        dropzone.classList.remove('border-light-accent', 'dark:border-dark-accent', 'bg-light-subtle/70', 'dark:bg-dark-accent/10');
      });
      dropzone?.addEventListener('drop', (e) => {
        e.preventDefault();
        dropzone.classList.remove('border-light-accent', 'dark:border-dark-accent', 'bg-light-subtle/70', 'dark:bg-dark-accent/10');
        if (e.dataTransfer?.files?.[0]) handleFile(e.dataTransfer.files[0]);
      });

      pasteArea?.addEventListener('input', (e) => {
        st.rawText = e.target.value;
        refreshCsvPreview();
      });

      document.querySelectorAll('.csv-delim-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          st.delimiterMode = btn.dataset.delim === '\\t' ? '\t' : btn.dataset.delim;
          refreshCsvPreview();
        });
      });

      targetSelect?.addEventListener('change', (e) => {
        st.targetDeckId = e.target.value;
        newDeckWrap.classList.toggle('hidden', st.targetDeckId !== '__new__');
        if (st.targetDeckId === '__new__') newDeckInput?.focus();
      });

      newDeckInput?.addEventListener('input', (e) => {
        st.newDeckName = e.target.value;
      });

      skipHeaderCb?.addEventListener('change', (e) => {
        st.skipHeader = e.target.checked;
        refreshCsvPreview();
      });

      swapSidesCb?.addEventListener('change', (e) => {
        st.swapSides = e.target.checked;
        refreshCsvPreview();
      });

      confirmBtn?.addEventListener('click', async () => {
        if (!st.parsedCards.length) return;

        let targetDeck = null;
        if (st.targetDeckId === '__new__') {
          const name = (newDeckInput.value || '').trim();
          if (!name) {
            showToast('Veuillez saisir un nom pour le nouveau paquet.', 'error');
            newDeckInput.focus();
            return;
          }
          targetDeck = {
            id: generateId('deck'),
            name,
            createdAt: Date.now(),
            updatedAt: Date.now(),
            cards: [],
          };
          appState.data.decks.push(targetDeck);
        } else {
          targetDeck = getDeckById(st.targetDeckId);
        }

        if (!targetDeck) {
          showToast('Paquet de destination introuvable.', 'error');
          return;
        }

        for (const pair of st.parsedCards) {
          targetDeck.cards.push(createCardObject(pair.front, pair.back));
        }

        const count = st.parsedCards.length;
        const deckName = targetDeck.name;
        closeModal();
        renderApp();
        await persistDeck(targetDeck);
        showToast(
          `${count} carte${count > 1 ? 's' : ''} importée${count > 1 ? 's' : ''} dans « ${deckName} ».`,
          'success'
        );
      });
    }

    function refreshCsvPreview() {
      const st = appState.csvImportState;
      if (!st) return;

      document.querySelectorAll('.csv-delim-btn').forEach((btn) => {
        const val = btn.dataset.delim === '\\t' ? '\t' : btn.dataset.delim;
        const active = val === st.delimiterMode;
        btn.className = `csv-delim-btn py-1.5 rounded-lg transition-colors ${
          active
            ? 'bg-light-card dark:bg-dark-card text-light-text dark:text-dark-text shadow-xs font-semibold'
            : 'text-light-muted dark:text-dark-muted hover:text-light-text dark:hover:text-dark-text'
        }`;
      });

      const detected = detectCsvDelimiter(st.rawText);
      st.detectedDelimiter = detected;
      const activeDelim = st.delimiterMode === 'auto' ? detected : st.delimiterMode;

      const delimLabels = { ',': 'Virgule', ';': 'Point-virgule', '\t': 'Tabulation' };
      const badgeEl = document.getElementById('csv-detected-badge');
      if (badgeEl) {
        badgeEl.textContent =
          st.rawText.trim() && st.delimiterMode === 'auto'
            ? `(détecté : ${delimLabels[detected] || detected})`
            : '';
      }

      let rows = parseRFC4180CSV(st.rawText, activeDelim);
      if (st.skipHeader && rows.length > 0) {
        rows = rows.slice(1);
      }

      const cards = [];
      for (const r of rows) {
        if (r.length < 2) continue;
        const colA = (r[0] || '').trim();
        const colB = (r[1] || '').trim();
        if (!colA || !colB) continue;
        cards.push(st.swapSides ? { front: colB, back: colA } : { front: colA, back: colB });
      }
      st.parsedCards = cards;

      const countBadge = document.getElementById('csv-count-badge');
      const previewBox = document.getElementById('csv-preview-box');
      const confirmBtn = document.getElementById('csv-confirm-import-btn');

      if (cards.length === 0) {
        countBadge.textContent = '0 carte prête';
        countBadge.className =
          'text-xs font-semibold px-2.5 py-0.5 rounded-full bg-light-subtle dark:bg-dark-subtle text-light-muted dark:text-dark-muted';
        confirmBtn.disabled = true;
        confirmBtn.textContent = 'Importer les cartes';
        previewBox.innerHTML = `<div class="p-4 text-center text-xs text-light-muted dark:text-dark-muted">${
          st.rawText.trim()
            ? 'Aucune paire Recto / Verso valide détectée. Essayez un autre séparateur.'
            : 'Importez un fichier ou collez du texte CSV pour voir l’aperçu instantané.'
        }</div>`;
        return;
      }

      countBadge.textContent = `${cards.length} carte${cards.length > 1 ? 's' : ''} prête${cards.length > 1 ? 's' : ''} à être importée${cards.length > 1 ? 's' : ''}`;
      countBadge.className =
        'text-xs font-semibold px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800 dark:bg-emerald-500/20 dark:text-emerald-300';
      confirmBtn.disabled = false;
      confirmBtn.textContent = `Importer ${cards.length} carte${cards.length > 1 ? 's' : ''}`;

      const sample = cards.slice(0, 5);
      previewBox.innerHTML = `
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs border-collapse">
            <thead>
              <tr class="border-b border-light-border dark:border-dark-border bg-light-subtle/70 dark:bg-dark-subtle/70 text-light-muted dark:text-dark-muted">
                <th class="py-2 px-3 font-semibold w-1/2">Recto</th>
                <th class="py-2 px-3 font-semibold w-1/2">Verso</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-light-border/70 dark:divide-dark-border/70">
              ${sample
                .map(
                  (c) => `
                <tr>
                  <td class="py-2 px-3 align-top break-words max-w-[220px]">${escapeHtml(c.front.length > 90 ? c.front.slice(0, 90) + '…' : c.front)}</td>
                  <td class="py-2 px-3 align-top break-words max-w-[220px] text-light-muted dark:text-dark-muted">${escapeHtml(c.back.length > 90 ? c.back.slice(0, 90) + '…' : c.back)}</td>
                </tr>
              `
                )
                .join('')}
            </tbody>
          </table>
        </div>
        ${
          cards.length > 5
            ? `<div class="px-3 py-1.5 text-[11px] text-center text-light-muted dark:text-dark-muted border-t border-light-border/70 dark:border-dark-border/70 bg-light-subtle/40 dark:bg-dark-subtle/40">+ ${cards.length - 5} autre${cards.length - 5 > 1 ? 's' : ''} carte${cards.length - 5 > 1 ? 's' : ''}</div>`
            : ''
        }
      `;
    }

    /* =====================================================================
       11. MOTEUR DE SESSION D'ÉTUDE (SRS & MODE RÉVISION LIBRE)

    function clearWaitingTimer() {
      if (appState.waitingTimerId) {
        clearInterval(appState.waitingTimerId);
        appState.waitingTimerId = null;
      }
    }

    function startStudySession(deckId, mode = 'srs') {
      const deck = getDeckById(deckId);
      if (!deck) return;

      if (deck.cards.length === 0) {
        showToast('Ajoutez d’abord des cartes dans ce paquet pour commencer.', 'info');
        openCardFormModal(deck.id);
        return;
      }

      clearWaitingTimer();
      appState.activeDeckId = deckId;
      appState.view = 'study';

      if (mode === 'free') {
        const shuffledIds = [...deck.cards]
          .sort(() => Math.random() - 0.5)
          .map((c) => c.id);

        appState.study = {
          deckId,
          mode: 'free',
          freeQueue: shuffledIds,
          initialTotal: shuffledIds.length,
          currentCardId: shuffledIds[0] || null,
          isFlipped: false,
          reviewedCount: 0,
          successCount: 0,
          ratings: { again: 0, hard: 0, good: 0, easy: 0 },
          completed: shuffledIds.length === 0,
          waitingCardId: null,
          waitingUntil: null,
        };
      } else {
        const counts = getDeckCounts(deck);
        appState.study = {
          deckId,
          mode: 'srs',
          initialTotal: Math.max(1, counts.totalDue),
          currentCardId: null,
          isFlipped: false,
          reviewedCount: 0,
          successCount: 0,
          ratings: { again: 0, hard: 0, good: 0, easy: 0 },
          completed: false,
          waitingCardId: null,
          waitingUntil: null,
        };
        pickNextSrsCard(false);
      }

      renderApp();
    }

    function pickNextSrsCard(forcePull = false) {
      const session = appState.study;
      if (!session || session.mode !== 'srs') return;

      const deck = getDeckById(session.deckId);
      if (!deck) return;

      const now = Date.now();
      const endToday = getEndOfLocalDay(now);

      clearWaitingTimer();
      session.isFlipped = false;
      session.waitingCardId = null;
      session.waitingUntil = null;

      // 1. Cartes en cours prêtes immédiatement
      const readyLearning = deck.cards
        .filter((c) => (c.status === 'learning' || c.status === 'relearning') && c.due <= now)
        .sort((a, b) => a.due - b.due);

      if (readyLearning.length > 0) {
        session.currentCardId = readyLearning[0].id;
        session.completed = false;
        return;
      }

      // 2. Cartes en révision dues aujourd'hui
      const dueReviews = deck.cards
        .filter((c) => c.status === 'review' && c.due <= endToday)
        .sort((a, b) => a.due - b.due);

      if (dueReviews.length > 0) {
        session.currentCardId = dueReviews[0].id;
        session.completed = false;
        return;
      }

      // 3. Nouvelles cartes
      const newCards = deck.cards.filter((c) => c.status === 'new');
      if (newCards.length > 0) {
        session.currentCardId = newCards[0].id;
        session.completed = false;
        return;
      }

      // 4. Cartes en cours en attente dans quelques minutes
      const pendingLearning = deck.cards
        .filter((c) => (c.status === 'learning' || c.status === 'relearning') && c.due > now)
        .sort((a, b) => a.due - b.due);

      if (pendingLearning.length > 0) {
        if (forcePull) {
          session.currentCardId = pendingLearning[0].id;
          session.completed = false;
          return;
        }
        session.currentCardId = null;
        session.waitingCardId = pendingLearning[0].id;
        session.waitingUntil = pendingLearning[0].due;
        session.completed = false;
        return;
      }

      session.currentCardId = null;
      session.completed = true;
    }

    function flipCurrentCard() {
      const session = appState.study;
      if (!session || !session.currentCardId || session.completed || session.waitingCardId) return;
      session.isFlipped = !session.isFlipped;

      const cardInner = document.getElementById('study-flip-inner');
      const controlsWrap = document.getElementById('study-controls-wrap');
      if (cardInner && controlsWrap) {
        cardInner.classList.toggle('is-flipped', session.isFlipped);
        renderStudyControlsInto(controlsWrap);
      } else {
        renderApp();
      }
    }

    function rateCurrentCard(rating) {
      const session = appState.study;
      if (!session || !session.currentCardId || !session.isFlipped) return;

      const deck = getDeckById(session.deckId);
      if (!deck) return;
      const card = deck.cards.find((c) => c.id === session.currentCardId);
      if (!card) return;

      session.reviewedCount++;
      if (rating !== 'again') {
        session.successCount++;
      }
      if (session.ratings[rating] !== undefined) {
        session.ratings[rating]++;
      }

      if (session.mode === 'free') {
        session.freeQueue.shift();
        if (rating === 'again') {
          session.freeQueue.push(card.id);
        }
        session.isFlipped = false;
        if (session.freeQueue.length === 0) {
          session.currentCardId = null;
          session.completed = true;
        } else {
          session.currentCardId = session.freeQueue[0];
        }
        renderApp();
        return;
      }

      const next = simulateSRS(card, rating, Date.now());
      card.status = next.status;
      card.step = next.step;
      card.interval = next.interval;
      card.ease = next.ease;
      card.reps = next.reps;
      card.lapses = next.lapses;
      card.due = next.due;

      persistDeck(deck);
      recordReviewInStats();

      pickNextSrsCard(false);
      renderApp();
    }

    function updateHeaderStats() {

      if (reviewedEl) reviewedEl.textContent = String(appState.data.stats.reviewedToday || 0);
      if (streakEl) streakEl.textContent = String(appState.data.stats.streak || 0);
    }

    function renderApp() {
      updateHeaderStats();
      updateHeaderAccountUI();
      clearWaitingTimer();

      if (!appState.ready) return;

      const main = document.getElementById('app-main');
      if (!main) return;

      if (appState.view === 'manage') {
        const deck = getDeckById(appState.activeDeckId);
        if (!deck) {
          appState.view = 'dashboard';
          renderDashboardView(main);
          return;
        }
        renderManageView(main, deck);
      } else if (appState.view === 'study') {
        const deck = getDeckById(appState.activeDeckId);
        if (!deck || !appState.study) {
          appState.view = 'dashboard';
          renderDashboardView(main);
          return;
        }
        renderStudyView(main, deck);
      } else {
        renderDashboardView(main);
      }
    }

      document.getElementById('dash-add-card-btn')?.addEventListener('click', () => openCardFormModal());

      container.querySelectorAll('[data-deck-action]').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const action = btn.dataset.deckAction;
          const deckId = btn.dataset.deckId;
          const deck = getDeckById(deckId);
          if (!deck) return;

          if (action === 'study') {
            startStudySession(deckId, 'srs');
          } else if (action === 'free') {
            startStudySession(deckId, 'free');
          } else if (action === 'manage') {
            appState.activeDeckId = deckId;
            appState.manageSearch = '';
            appState.manageFilter = 'all';
            appState.view = 'manage';
            renderApp();
          } else if (action === 'add-card') {
            openCardFormModal(deckId);
          } else if (action === 'rename') {
            openDeckFormModal(deck);
          } else if (action === 'export') {
            exportDeckToCSV(deckId);
          } else if (action === 'delete') {
            openConfirmModal({
              title: `Supprimer « ${deck.name} » ?`,
              message: `Cette action supprimera définitivement le paquet et ses ${deck.cards.length} carte${deck.cards.length > 1 ? 's' : ''}.`,
              confirmLabel: 'Supprimer',
              danger: true,
              onConfirm: async () => {
                appState.data.decks = appState.data.decks.filter((d) => d.id !== deckId);
                renderApp();
                await removeDeckPersistence(deckId);
                showToast(`Paquet « ${deck.name} » supprimé.`, 'info');
              },
            });
          }
        });
      });
    }

    function renderManageView(container, deck) {
      const now = Date.now();

      const q = (appState.manageSearch || '').trim().toLowerCase();
      const filter = appState.manageFilter || 'all';

      const filteredCards = deck.cards.filter((card) => {
        const matchesQuery =
          !q || card.front.toLowerCase().includes(q) || card.back.toLowerCase().includes(q);
        if (!matchesQuery) return false;

        if (filter === 'new') return card.status === 'new';
        if (filter === 'learning') return card.status === 'learning' || card.status === 'relearning';
        if (filter === 'due') return card.status === 'review' && card.due <= endToday;
        if (filter === 'mastered') return card.status === 'review' && card.due > endToday;
        return true;
      });

        { id: 'all', label: `Toutes (${deck.cards.length})` },
        { id: 'new', label: `Nouvelles (${counts.newCount})` },
        { id: 'learning', label: `En cours (${counts.learningCount})` },
        { id: 'due', label: `À réviser (${counts.reviewDueCount})` },
        { id: 'mastered', label: `Planifiées (${deck.cards.length - counts.totalDue})` },
      ];

            <div>
              <div class="flex items-center gap-2.5 flex-wrap">
                <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">${escapeHtml(deck.name)}</h1>
                <button id="manage-rename-deck-btn" type="button" class="p-1.5 rounded-lg text-light-muted hover:text-light-text dark:hover:text-dark-text hover:bg-light-subtle dark:hover:bg-dark-subtle transition-colors" title="Renommer le paquet">
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                </button>
              </div>
              <p class="text-sm text-light-muted dark:text-dark-muted mt-1">

                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>

                <p class="text-sm text-light-muted dark:text-dark-muted">

        renderApp();

        startStudySession(deck.id, counts.totalDue > 0 ? 'srs' : 'free');

      document.getElementById('manage-import-btn')?.addEventListener('click', () => openCsvImportModal(deck.id));
      document.getElementById('manage-export-btn')?.addEventListener('click', () => exportDeckToCSV(deck.id));

      document.getElementById('manage-reset-deck-btn')?.addEventListener('click', () => {
        openConfirmModal({
          title: 'Réinitialiser tout le paquet ?',
          message: `Toutes les cartes de « ${deck.name} » redeviendront des nouvelles cartes. Leur contenu ne sera pas modifié.`,
          confirmLabel: 'Réinitialiser',
          danger: true,
          onConfirm: async () => {
            deck.cards.forEach(resetCardProgress);
            renderApp();
            await persistDeck(deck);
            showToast('Progression du paquet réinitialisée.', 'success');
          },
        });
      });

      const searchInput = document.getElementById('manage-search-input');
      searchInput?.addEventListener('input', (e) => {
        appState.manageSearch = e.target.value;
        const pos = e.target.selectionStart;
        renderManageView(container, deck);
        const nextInput = document.getElementById('manage-search-input');
        if (nextInput) {
          nextInput.focus();
          nextInput.setSelectionRange(pos, pos);
        }
      });

      container.querySelectorAll('[data-manage-filter]').forEach((btn) => {
        btn.addEventListener('click', () => {
          appState.manageFilter = btn.dataset.manageFilter;
          renderManageView(container, deck);
        });
      });

      container.querySelectorAll('[data-card-action]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const action = btn.dataset.cardAction;
          const cardId = btn.dataset.cardId;
          const card = deck.cards.find((c) => c.id === cardId);
          if (!card) return;

          if (action === 'edit') {
            openCardFormModal(deck.id, card);
          } else if (action === 'reset') {
            openConfirmModal({
              title: 'Réinitialiser cette carte ?',
              message: 'Son historique de répétition espacée sera remis à zéro (statut Nouvelle).',
              confirmLabel: 'Réinitialiser',
              onConfirm: async () => {
                resetCardProgress(card);
                renderApp();
                await persistDeck(deck);
                showToast('Progression de la carte réinitialisée.', 'info');
              },
            });
          } else if (action === 'delete') {
            openConfirmModal({
              title: 'Supprimer cette carte ?',
              message: 'Cette flashcard sera définitivement supprimée du paquet.',
              confirmLabel: 'Supprimer',
              danger: true,
              onConfirm: async () => {
                deck.cards = deck.cards.filter((c) => c.id !== cardId);
                renderApp();
                await persistDeck(deck);
                showToast('Carte supprimée.', 'info');
              },
            });
          }
        });
      });
    }
