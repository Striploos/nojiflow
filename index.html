    /* -------------------------------------------------------------------
       VUE 3 : SESSION DE RÉVISION (SRS & RÉVISION LIBRE)
    ------------------------------------------------------------------- */
    function renderStudyView(container, deck) {
      const session = appState.study;
      const now = Date.now();
      const counts = getDeckCounts(deck, now);

      let progressPct = 0;
      if (session.completed) {
        progressPct = 100;
      } else if (session.mode === 'free') {
        const done = Math.max(0, session.initialTotal - session.freeQueue.length);
        progressPct = Math.min(100, Math.round((done / Math.max(1, session.initialTotal)) * 100));
      } else {
        const remaining = counts.totalDue;
        const totalEstimate = Math.max(session.initialTotal, remaining + session.reviewedCount);
        const done = Math.max(0, totalEstimate - remaining);
        progressPct = Math.min(99, Math.round((done / Math.max(1, totalEstimate)) * 100));
      }

      const topBarHtml = `
        <div class="max-w-3xl mx-auto mb-6">
          <div class="flex items-center justify-between gap-3 mb-3">
            <button id="study-exit-btn" type="button" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-sm font-medium text-light-muted dark:text-dark-muted hover:text-light-text dark:hover:text-dark-text hover:bg-light-subtle dark:hover:bg-dark-subtle transition-colors">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
              Quitter
            </button>

            <div class="text-center truncate px-2">
              <div class="text-sm font-semibold truncate">${escapeHtml(deck.name)}</div>
              ${
                session.mode === 'free'
                  ? '<div class="text-[11px] font-medium text-violet-600 dark:text-dark-accentSoft">Mode Révision Libre</div>'
                  : ''
              }
            </div>

            ${
              session.mode === 'srs'
                ? `
              <div class="flex items-center gap-2 text-xs font-semibold tabular-nums">
                <span class="px-2 py-0.5 rounded-md bg-blue-50 text-blue-600 dark:bg-blue-500/15 dark:text-blue-400" title="Nouvelles">${counts.newCount}</span>
                <span class="px-2 py-0.5 rounded-md bg-orange-50 text-orange-600 dark:bg-orange-500/15 dark:text-orange-400" title="En cours / À revoir">${counts.learningCount}</span>
                <span class="px-2 py-0.5 rounded-md bg-emerald-50 text-emerald-600 dark:bg-emerald-500/15 dark:text-emerald-400" title="À réviser">${counts.reviewDueCount}</span>
              </div>
            `
                : `
              <div class="text-xs font-semibold text-light-muted dark:text-dark-muted tabular-nums">
                ${session.freeQueue.length} restante${session.freeQueue.length > 1 ? 's' : ''}
              </div>
            `
            }
          </div>

          <div class="w-full h-2 rounded-full bg-light-subtle dark:bg-dark-subtle overflow-hidden">
            <div
              class="h-full rounded-full bg-light-accent dark:bg-dark-accent transition-all duration-500 ease-out"
              style="width: ${progressPct}%"
            ></div>
          </div>
        </div>
      `;

      // CAS A : SESSION TERMINÉE
      if (session.completed) {
        const successRate =
          session.reviewedCount > 0
            ? Math.round((session.successCount / session.reviewedCount) * 100)
            : 100;

        container.innerHTML = `
          <div class="animate-fade-slide">
            ${topBarHtml}
            <div class="max-w-xl mx-auto mt-8 rounded-3xl bg-light-card dark:bg-dark-card border border-light-border dark:border-dark-border p-8 sm:p-10 text-center shadow-card dark:shadow-card-dark">
              <div class="w-16 h-16 mx-auto rounded-2xl bg-emerald-50 dark:bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 flex items-center justify-center mb-5">
                <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                  <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
              </div>

              <h2 class="text-2xl font-bold tracking-tight">
                ${session.mode === 'free' ? 'Révision libre terminée !' : 'Bravo, session terminée !'}
              </h2>
              <p class="text-sm text-light-muted dark:text-dark-muted mt-2">
                ${
                  session.reviewedCount > 0
                    ? 'Vous avez terminé toutes les cartes prévues pour le moment.'
                    : 'Aucune carte n’est due pour le moment dans ce paquet.'
                }
              </p>

              <div class="mt-6 grid grid-cols-2 gap-3">
                <div class="rounded-2xl p-4 bg-light-bg dark:bg-dark-bg border border-light-border dark:border-dark-border">
                  <div class="text-2xl font-bold tabular-nums">${session.reviewedCount}</div>
                  <div class="text-xs text-light-muted dark:text-dark-muted mt-0.5">Réponse${session.reviewedCount > 1 ? 's' : ''} évaluée${session.reviewedCount > 1 ? 's' : ''}</div>
                </div>
                <div class="rounded-2xl p-4 bg-light-bg dark:bg-dark-bg border border-light-border dark:border-dark-border">
                  <div class="text-2xl font-bold tabular-nums text-emerald-600 dark:text-emerald-400">${successRate}%</div>
                  <div class="text-xs text-light-muted dark:text-dark-muted mt-0.5">Taux de réussite</div>
                </div>
              </div>

              <div class="mt-7 flex flex-col sm:flex-row items-center justify-center gap-3">
                <button id="finish-back-dash-btn" type="button" class="w-full sm:w-auto px-5 py-3 rounded-xl text-sm font-semibold text-white bg-light-accent hover:bg-light-accentHover dark:bg-dark-accent dark:hover:bg-dark-accentHover transition-colors">
                  Retour aux paquets
                </button>
                <button id="finish-free-mode-btn" type="button" class="w-full sm:w-auto px-5 py-3 rounded-xl text-sm font-medium bg-light-subtle dark:bg-dark-subtle hover:opacity-90 transition-opacity">
                  Mode Révision Libre
                </button>
              </div>
            </div>
          </div>
        `;

        document.getElementById('study-exit-btn')?.addEventListener('click', exitStudySession);
        document.getElementById('finish-back-dash-btn')?.addEventListener('click', exitStudySession);
        document.getElementById('finish-free-mode-btn')?.addEventListener('click', () => {
          startStudySession(deck.id, 'free');
        });
        return;
      }

      // CAS B : CARTES EN ATTENTE DE QUELQUES MINUTES
      if (session.waitingCardId && session.waitingUntil) {
        container.innerHTML = `
          <div class="animate-fade-slide">
            ${topBarHtml}
            <div class="max-w-xl mx-auto mt-8 rounded-3xl bg-light-card dark:bg-dark-card border border-light-border dark:border-dark-border p-8 sm:p-10 text-center shadow-card dark:shadow-card-dark">
              <div class="w-14 h-14 mx-auto rounded-2xl bg-orange-50 dark:bg-orange-500/15 text-orange-600 dark:text-orange-400 flex items-center justify-center mb-4">
                <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"></circle>
                  <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
              </div>

              <h2 class="text-xl font-bold tracking-tight">Prochaine carte bientôt prête</h2>
              <p class="text-sm text-light-muted dark:text-dark-muted mt-1.5">
                Il reste <span class="font-semibold text-light-text dark:text-dark-text">${counts.learningCount}</span> carte${counts.learningCount > 1 ? 's' : ''} en cours d’apprentissage à revoir dans quelques instants.
              </p>

              <div id="waiting-countdown" class="mt-6 text-4xl font-bold font-mono tracking-tight text-light-text dark:text-dark-accentSoft tabular-nums">
                --:--
              </div>

              <div class="mt-7 flex flex-col sm:flex-row items-center justify-center gap-3">
                <button id="waiting-force-btn" type="button" class="w-full sm:w-auto px-5 py-3 rounded-xl text-sm font-semibold text-white bg-light-accent hover:bg-light-accentHover dark:bg-dark-accent dark:hover:bg-dark-accentHover transition-colors">
                  Réviser sans attendre
                </button>
                <button id="waiting-exit-btn" type="button" class="w-full sm:w-auto px-5 py-3 rounded-xl text-sm font-medium border border-light-border dark:border-dark-border hover:bg-light-subtle dark:hover:bg-dark-subtle transition-colors">
                  Revenir plus tard
                </button>
              </div>
            </div>
          </div>
        `;

        document.getElementById('study-exit-btn')?.addEventListener('click', exitStudySession);
        document.getElementById('waiting-exit-btn')?.addEventListener('click', exitStudySession);
        document.getElementById('waiting-force-btn')?.addEventListener('click', () => {
          pickNextSrsCard(true);
          renderApp();
        });

        const updateCountdown = () => {
          const diff = session.waitingUntil - Date.now();
          if (diff <= 0) {
            clearWaitingTimer();
            pickNextSrsCard(false);
            renderApp();
            return;
          }
          const totalSec = Math.ceil(diff / 1000);
          const mins = String(Math.floor(totalSec / 60)).padStart(2, '0');
          const secs = String(totalSec % 60).padStart(2, '0');
          const el = document.getElementById('waiting-countdown');
          if (el) el.textContent = `${mins}:${secs}`;
        };
        updateCountdown();
        appState.waitingTimerId = setInterval(updateCountdown, 500);
        return;
      }

      // CAS C : CARTE ACTIVE À ÉTUDIER
      const card = deck.cards.find((c) => c.id === session.currentCardId);
      if (!card) {
        pickNextSrsCard(false);
        renderApp();
        return;
      }

      const statusBadgeMap = {
        new: { label: 'Nouvelle', cls: 'bg-blue-50 text-blue-600 dark:bg-blue-500/15 dark:text-blue-400' },
        learning: { label: 'En apprentissage', cls: 'bg-orange-50 text-orange-600 dark:bg-orange-500/15 dark:text-orange-400' },
        relearning: { label: 'À réapprendre', cls: 'bg-rose-50 text-rose-600 dark:bg-rose-500/15 dark:text-rose-400' },
        review: { label: 'Révision', cls: 'bg-emerald-50 text-emerald-600 dark:bg-emerald-500/15 dark:text-emerald-400' },
      };
      const badge = statusBadgeMap[card.status] || statusBadgeMap.new;

      container.innerHTML = `
        <div class="animate-fade-slide">
          ${topBarHtml}

          <div class="max-w-2xl mx-auto perspective-1200">
            <div
              id="study-flip-inner"
              class="flip-card-inner cursor-pointer select-text ${session.isFlipped ? 'is-flipped' : ''}"
              title="Cliquez pour retourner la carte"
            >
              <!-- FACE RECTO -->
              <div class="flip-card-face min-h-[290px] sm:min-h-[340px] rounded-3xl bg-light-card dark:bg-dark-card border border-light-border dark:border-dark-border p-6 sm:p-10 shadow-card dark:shadow-card-dark flex flex-col justify-between">
                <div class="flex items-center justify-between gap-2">
                  <span class="text-[11px] font-semibold uppercase tracking-widest text-light-muted dark:text-dark-muted">Question</span>
                  <span class="text-[11px] font-semibold px-2.5 py-0.5 rounded-full ${badge.cls}">
                    ${session.mode === 'free' ? 'Révision libre' : badge.label}
                  </span>
                </div>

                <div class="my-auto py-8 text-center text-lg sm:text-2xl font-medium leading-relaxed break-words">
                  ${renderCardContent(card.front)}
                </div>

                <div class="text-center text-xs text-light-muted/80 dark:text-dark-muted/80">
                  Cliquez sur la carte ou appuyez sur <kbd class="px-1.5 py-0.5 rounded bg-light-subtle dark:bg-dark-subtle font-mono text-[11px]">Espace</kbd>
                </div>
              </div>

              <!-- FACE VERSO -->
              <div class="flip-card-face flip-card-back min-h-[290px] sm:min-h-[340px] rounded-3xl bg-light-card dark:bg-dark-card border border-light-border dark:border-dark-accent/35 p-6 sm:p-10 shadow-card dark:shadow-card-dark flex flex-col justify-between">
                <div>
                  <div class="flex items-center justify-between gap-2 pb-3 mb-4 border-b border-light-border/70 dark:border-dark-border/70">
                    <span class="text-[11px] font-semibold uppercase tracking-widest text-light-muted dark:text-dark-muted">Réponse</span>
                    <span class="text-xs text-light-muted dark:text-dark-muted truncate max-w-[70%]">${escapeHtml(card.front)}</span>
                  </div>
                </div>

                <div class="my-auto py-4 text-center text-base sm:text-xl leading-relaxed break-words">
                  ${renderCardContent(card.back)}
                </div>

                <div class="pt-3 text-center text-xs text-light-muted/75 dark:text-dark-muted/75">
                  Évaluez votre facilité à retrouver la réponse ci-dessous
                </div>
              </div>
            </div>
          </div>

          <div id="study-controls-wrap" class="max-w-2xl mx-auto mt-6"></div>
        </div>
      `;

      document.getElementById('study-exit-btn')?.addEventListener('click', exitStudySession);

      document.getElementById('study-flip-inner')?.addEventListener('click', () => {
        const selection = window.getSelection();
        if (selection && selection.toString().length > 0) return;
        flipCurrentCard();
      });

      renderStudyControlsInto(document.getElementById('study-controls-wrap'));
    }

    function renderStudyControlsInto(wrapper) {
      if (!wrapper || !appState.study) return;
      const session = appState.study;
      const deck = getDeckById(session.deckId);
      const card = deck?.cards.find((c) => c.id === session.currentCardId);
      if (!card) return;

      if (!session.isFlipped) {
        wrapper.innerHTML = `
          <button
            id="show-answer-btn"
            type="button"
            class="w-full py-4 px-6 rounded-2xl text-base font-semibold text-white bg-light-accent hover:bg-light-accentHover dark:bg-dark-accent dark:hover:bg-dark-accentHover shadow-soft transition-all active:scale-[0.99]"
          >
            Afficher la réponse
          </button>
          <p class="mt-3 text-center text-xs text-light-muted dark:text-dark-muted hidden sm:block">
            Raccourcis : <kbd class="px-1.5 py-0.5 rounded bg-light-subtle dark:bg-dark-subtle font-mono">Espace</kbd> retourner · <kbd class="px-1.5 py-0.5 rounded bg-light-subtle dark:bg-dark-subtle font-mono">1</kbd>–<kbd class="px-1.5 py-0.5 rounded bg-light-subtle dark:bg-dark-subtle font-mono">4</kbd> évaluer
          </p>
        `;
        document.getElementById('show-answer-btn')?.addEventListener('click', flipCurrentCard);
        return;
      }

      if (session.mode === 'free') {
        wrapper.innerHTML = `
          <div class="grid grid-cols-2 gap-3 animate-fade-slide">
            <button type="button" data-rate="again" class="py-3.5 px-4 rounded-2xl border border-rose-200 dark:border-rose-500/35 bg-rose-50/80 dark:bg-rose-500/15 text-rose-700 dark:text-rose-300 hover:bg-rose-100 dark:hover:bg-rose-500/25 transition-colors flex flex-col items-center">
              <span class="text-sm font-semibold">À revoir</span>
              <span class="text-xs opacity-75 mt-0.5">Remettre dans la file [1]</span>
            </button>
            <button type="button" data-rate="good" class="py-3.5 px-4 rounded-2xl border border-emerald-200 dark:border-emerald-500/35 bg-emerald-50/80 dark:bg-emerald-500/15 text-emerald-700 dark:text-emerald-300 hover:bg-emerald-100 dark:hover:bg-emerald-500/25 transition-colors flex flex-col items-center">
              <span class="text-sm font-semibold">Acquis</span>
              <span class="text-xs opacity-75 mt-0.5">Carte suivante [3]</span>
            </button>
          </div>
        `;
      } else {
        const now = Date.now();
        const pAgain = simulateSRS(card, 'again', now);
        const pHard = simulateSRS(card, 'hard', now);
        const pGood = simulateSRS(card, 'good', now);
        const pEasy = simulateSRS(card, 'easy', now);

        wrapper.innerHTML = `
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 sm:gap-3 animate-fade-slide">
            <button
              type="button"
              data-rate="again"
              class="group relative py-3.5 px-3 rounded-2xl border border-rose-200/90 dark:border-rose-500/35 bg-rose-50/80 dark:bg-rose-500/12 hover:bg-rose-100 dark:hover:bg-rose-500/22 text-rose-700 dark:text-rose-300 transition-all active:scale-[0.98] flex flex-col items-center"
            >
              <span class="text-[11px] font-semibold opacity-80 mb-0.5">${escapeHtml(pAgain.label)}</span>
              <span class="text-sm font-bold">À revoir</span>
              <span class="hidden sm:inline-block mt-1 text-[10px] font-mono opacity-60">Touche 1</span>
            </button>

            <button
              type="button"
              data-rate="hard"
              class="group relative py-3.5 px-3 rounded-2xl border border-orange-200/90 dark:border-orange-500/35 bg-orange-50/80 dark:bg-orange-500/12 hover:bg-orange-100 dark:hover:bg-orange-500/22 text-orange-700 dark:text-orange-300 transition-all active:scale-[0.98] flex flex-col items-center"
            >
              <span class="text-[11px] font-semibold opacity-80 mb-0.5">${escapeHtml(pHard.label)}</span>
              <span class="text-sm font-bold">Difficile</span>
              <span class="hidden sm:inline-block mt-1 text-[10px] font-mono opacity-60">Touche 2</span>
            </button>

            <button
              type="button"
              data-rate="good"
              class="group relative py-3.5 px-3 rounded-2xl border border-emerald-200/90 dark:border-emerald-500/35 bg-emerald-50/80 dark:bg-emerald-500/12 hover:bg-emerald-100 dark:hover:bg-emerald-500/22 text-emerald-700 dark:text-emerald-300 transition-all active:scale-[0.98] flex flex-col items-center"
            >
              <span class="text-[11px] font-semibold opacity-80 mb-0.5">${escapeHtml(pGood.label)}</span>
              <span class="text-sm font-bold">Bien</span>
              <span class="hidden sm:inline-block mt-1 text-[10px] font-mono opacity-60">Touche 3</span>
            </button>

            <button
              type="button"
              data-rate="easy"
              class="group relative py-3.5 px-3 rounded-2xl border border-indigo-200/90 dark:border-violet-500/40 bg-indigo-50/80 dark:bg-violet-500/15 hover:bg-indigo-100 dark:hover:bg-violet-500/25 text-indigo-700 dark:text-violet-300 transition-all active:scale-[0.98] flex flex-col items-center"
            >
              <span class="text-[11px] font-semibold opacity-80 mb-0.5">${escapeHtml(pEasy.label)}</span>
              <span class="text-sm font-bold">Facile</span>
              <span class="hidden sm:inline-block mt-1 text-[10px] font-mono opacity-60">Touche 4</span>
            </button>
          </div>

          <p class="mt-3 text-center text-xs text-light-muted dark:text-dark-muted hidden sm:block">
            Raccourcis : <kbd class="px-1.5 py-0.5 rounded bg-light-subtle dark:bg-dark-subtle font-mono">Espace</kbd> retourner · <kbd class="px-1.5 py-0.5 rounded bg-light-subtle dark:bg-dark-subtle font-mono">1</kbd> À revoir · <kbd class="px-1.5 py-0.5 rounded bg-light-subtle dark:bg-dark-subtle font-mono">2</kbd> Difficile · <kbd class="px-1.5 py-0.5 rounded bg-light-subtle dark:bg-dark-subtle font-mono">3</kbd> Bien · <kbd class="px-1.5 py-0.5 rounded bg-light-subtle dark:bg-dark-subtle font-mono">4</kbd> Facile
          </p>
        `;
      }

      wrapper.querySelectorAll('[data-rate]').forEach((btn) => {
        btn.addEventListener('click', () => rateCurrentCard(btn.dataset.rate));
      });
    }

    function exitStudySession() {
      clearWaitingTimer();
      appState.study = null;
      appState.view = 'dashboard';
      renderApp();
    }

    /* =====================================================================
       13. THÈME CLAIR / SOMBRE & RACCOURCIS CLAVIER GLOBAUX
    ===================================================================== */

    function toggleTheme() {
      const nextTheme = getCurrentTheme() === 'dark' ? 'light' : 'dark';
      applyTheme(nextTheme);
      persistProfile();
    }

    function setupGlobalListeners() {
      document.getElementById('brand-home-btn')?.addEventListener('click', () => {
        clearWaitingTimer();
        appState.study = null;
        appState.view = 'dashboard';
        renderApp();
      });

      document.getElementById('header-import-btn')?.addEventListener('click', () => {
        openCsvImportModal(appState.view === 'manage' ? appState.activeDeckId : null);
      });

      document.getElementById('header-account-btn')?.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!cloud.user) {
          openAuthModal('login');
        } else {
          toggleAccountDropdown();
        }
      });

      document.addEventListener('click', (e) => {
        if (cloud.dropdownOpen && !e.target.closest('#account-menu-wrapper')) {
          toggleAccountDropdown(false);
        }
      });

      document.getElementById('theme-toggle-btn')?.addEventListener('click', toggleTheme);

      const backdrop = document.getElementById('modal-backdrop');
      backdrop?.addEventListener('click', (e) => {
        if (e.target === backdrop || e.target.closest('[data-close-modal]')) {
          closeModal();
        }
      });

      document.addEventListener('keydown', (e) => {
        const modalOpen = !document.getElementById('modal-backdrop').classList.contains('hidden');

        if (e.key === 'Escape') {
          if (modalOpen) {
            closeModal();
            return;
          }
          if (cloud.dropdownOpen) {
            toggleAccountDropdown(false);
            return;
          }
        }

        if (modalOpen) return;

        const tag = (e.target.tagName || '').toLowerCase();
        if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable) {
          return;
        }

        if (
          appState.view === 'study' &&
          appState.study &&
          !appState.study.completed &&
          !appState.study.waitingCardId
        ) {
          if (e.code === 'Space') {
            e.preventDefault();
            flipCurrentCard();
            return;
          }

          if (appState.study.isFlipped) {
            if (e.key === '1') {
              e.preventDefault();
              rateCurrentCard('again');
            } else if (e.key === '2' && appState.study.mode === 'srs') {
              e.preventDefault();
              rateCurrentCard('hard');
            } else if (e.key === '3') {
              e.preventDefault();
              rateCurrentCard('good');
            } else if (e.key === '4' && appState.study.mode === 'srs') {
              e.preventDefault();
              rateCurrentCard('easy');
            }
          }
        }
      });
    }

    /* =====================================================================
       14. INITIALISATION AU CHARGEMENT
    ===================================================================== */
    function init() {
      setupGlobalListeners();
      initFirebaseAndAuth();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
